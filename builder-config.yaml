# OpenTelemetry Collector Builder (OCB) Configuration
#
# Build using the official OCB CLI:
#   ocb --config builder-config.yaml
#
# Or build via Docker without installing the OCB binary:
#   docker run --rm -v $(pwd):/workspace -w /workspace otel/opentelemetry-collector-builder:0.122.0 --config /workspace/builder-config.yaml

dist:
  module: github.com/nats-otel/nats-otel/cmd/otelcol-nats
  name: otelcol-nats
  description: "OpenTelemetry Collector distribution with NATS Receiver"
  version: "1.0.0"
  output_path: ./dist
  otelcol_version: "0.122.0"

receivers:
  - gomod: github.com/nats-otel/nats-otel/receiver/natsreceiver v0.0.1
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.122.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/batchprocessor v0.122.0

exporters:
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.122.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.122.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.28.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.28.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.28.0

replaces:
  - github.com/nats-otel/nats-otel => .
